version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpcl-backend
    restart: always
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - kpcl-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_ANALYTICS_URL=/analytics/
    container_name: kpcl-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kpcl-network

networks:
  kpcl-network:
    driver: bridge
