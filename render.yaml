services:
  - type: web
    name: kpcl-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  - type: web
    name: kpcl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kpcl-api.onrender.com/api/v1
      - key: VITE_ANALYTICS_URL
        value: https://kpcl-api.onrender.com/analytics/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
