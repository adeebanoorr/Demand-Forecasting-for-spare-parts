[phases.setup]
nixPkgs = ["python312", "nodejs_20", "gcc"]

[phases.build]
cmds = [
    "mkdir -p /app/src/webapp/dist",
    "cd /app/src/webapp && npm install && (npm run build > /app/build.log 2>&1)",
    "find /app -name 'index.html' -ls >> /app/build.log",
    "pip install -r requirements.txt"
]

[start]
cmd = "gunicorn app:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
